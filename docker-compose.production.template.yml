services:

  backend:
    image: bhiv/mitra-backend:IMG_TAG
    container_name: mitra_backend
    ports:
      - "8011:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=${MONGODB_URI}
    networks:
      - mitra_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  frontend:
    image: bhiv/mitra-frontend:IMG_TAG
    container_name: mitra_frontend
    ports:
      - "3007:3000"
    networks:
      - mitra_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  mitra_network:
    driver: bridge
