apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitra-backend
  namespace: mitra
  labels:
    app.kubernetes.io/name: mitra-backend
    app.kubernetes.io/part-of: mitra
spec:
  # Keep one replica: this application currently has in-memory notification/session
  # state and may run a reminder scheduler. Scale only after state/scheduler design
  # is made multi-replica safe.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mitra-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitra-backend
        app.kubernetes.io/part-of: mitra
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: bhiv/mitra-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mitra-backend-config
            - secretRef:
                name: mitra-backend-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
            - name: backend-logs
              mountPath: /app/logs
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: mitra-backend-data
        - name: backend-logs
          emptyDir: {}
