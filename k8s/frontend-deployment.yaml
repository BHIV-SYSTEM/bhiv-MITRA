apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitra-frontend
  namespace: mitra
  labels:
    app.kubernetes.io/name: mitra-frontend
    app.kubernetes.io/part-of: mitra
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mitra-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitra-frontend
        app.kubernetes.io/part-of: mitra
    spec:
      containers:
        - name: frontend
          image: bhiv/mitra-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
