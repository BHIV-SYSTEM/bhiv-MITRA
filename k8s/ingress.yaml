apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mitra
  namespace: mitra
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mitra.blackholeinfiverse.com
      secretName: mitra-tls
  rules:
    - host: mitra.blackholeinfiverse.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mitra-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mitra-frontend
                port:
                  number: 3000
