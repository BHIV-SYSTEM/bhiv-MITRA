<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Mitra — Your Universal AI Companion. Manage emails, calendar, tasks, and more with AI."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>MITRA — AI Companion</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <style>
      mitra-companion {
        display: block;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999999;
      }
    </style>
    <!-- MITRA Companion Chatbot -->
    <mitra-companion hide-fab="true" stylesheet-path="/styles/mitra-companion.css?v=v33" api-base-url="https://mitra.blackholeinfiverse.com"></mitra-companion>
    <script type="module" src="/src/mitra-companion.js?v=v33"></script>
    <script>
      // Clean floating orb on initial load
      try {
        const raw = localStorage.getItem('mitra_context_store');
        if (raw) {
          const parsed = JSON.parse(raw);
          parsed.dockMode = 'floating';
          parsed.position = null;
          parsed.windowState = 'minimized';
          localStorage.setItem('mitra_context_store', JSON.stringify(parsed));
        }
      } catch (e) { }
    </script>
  </body>
</html>
